name: Notify Triagers

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  Notify-triagers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # SECURITY: this workflow runs on `pull_request_target` and has access to secrets.
      # It must NEVER check out or execute code/data from the (untrusted) fork. CODEOWNERS is read
      # from the base branch and PR information is fetched through the API and passed via env vars.
      - name: Checkout Repository (base branch only)
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      - name: Get commit message
        id: commit-message
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Extract the commit message of the PR head commit
          commit_message=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message' | head -n 1)
          if [[ "$commit_message" == *"Merge branch"* ]]; then
            echo "Last commit is a merge commit"
            echo "isMergeCommit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last commit message does not contain Merge branch"
            echo "isMergeCommit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Count changed files
        id: changed_files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          changed_files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')

          md_count=$(echo "$changed_files" | grep -c '\.md$' || true)
          non_md_count=$(echo "$changed_files" | grep -vc '\.md$' || true)

          echo "md_count=$md_count" >> "$GITHUB_OUTPUT"
          echo "non_md_count=$non_md_count" >> "$GITHUB_OUTPUT"

      - name: Extract Doc Triage Maintainers
        id: doc-triager
        run: |
          docTriagers=$(grep '^#' CODEOWNERS | tail -n 2 | head -n 1)
          prefix="#docTriagers: "
          docTriagers=${docTriagers#$prefix}
          # only keep valid GitHub logins
          docTriagers=$(echo "$docTriagers" | tr ' ' '\n' | grep -E '^[A-Za-z0-9-]{1,39}$' | tr '\n' ' ')
          echo "docTriagers=$docTriagers" >> "$GITHUB_ENV"

      - name: Extract Code Triage Maintainers
        id: code-triager
        run: |
          codeTriagers=$(grep '^#' CODEOWNERS | tail -n 1)
          prefix="#codeTriagers: "
          codeTriagers=${codeTriagers#$prefix}
          codeTriagers=$(echo "$codeTriagers" | tr ' ' '\n' | grep -E '^[A-Za-z0-9-]{1,39}$' | tr '\n' ' ')
          echo "codeTriagers=$codeTriagers" >> "$GITHUB_ENV"

      - name: Add Reviewers for code files
        if: ${{ steps.commit-message.outputs.isMergeCommit == 'false' && steps.changed_files.outputs.non_md_count > 0 }}
        env:
          GH_TOKEN_REVIEWERS: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IFS=' ' read -r -a codeTriagers <<< "$codeTriagers"
          reviewers=$(printf ', "%s"' "${codeTriagers[@]}")
          reviewers=[${reviewers:2}]
          curl -X POST \
          -H "Authorization: token ${GH_TOKEN_REVIEWERS}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
          -d "{\"reviewers\": $reviewers}"

      - name: Add Reviewers for doc files
        if: ${{ steps.commit-message.outputs.isMergeCommit == 'false' && steps.changed_files.outputs.md_count > 0 }}
        env:
          GH_TOKEN_REVIEWERS: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          IFS=' ' read -r -a docTriagers <<< "$docTriagers"
          reviewers=$(printf ', "%s"' "${docTriagers[@]}")
          reviewers=[${reviewers:2}]
          curl -X POST \
          -H "Authorization: token ${GH_TOKEN_REVIEWERS}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
          -d "{\"reviewers\": $reviewers}"
